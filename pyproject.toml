[project]
name = "config-loader"
version = "0.1.0"
description = "A tiny, dependency-free JSON configuration loader with env overrides"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
